name: Native CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'apps/native/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - 'tsconfig.json'
      - '.github/workflows/native-ci.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/native/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - 'tsconfig.json'
      - '.github/workflows/native-ci.yml'

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: npm ci

      - name: Lint Native
        run: npx turbo run lint --filter=sentimeta-native

      - name: Typecheck Native
        run: npx turbo run typecheck --filter=sentimeta-native
